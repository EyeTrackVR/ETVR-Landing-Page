<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;550;650;750&display=swap" rel="stylesheet">
<style>
    :root {
        --background: #09090c;
        --text: #f2f0f5;
        --muted: #99979f;
        --accent: #b5a0ee;
        --line: rgba(255, 255, 255, .1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
        background: var(--background);
        color: var(--text);
        font-family: Inter, system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        -webkit-font-smoothing: antialiased;
    }
    /* Faint accent wash in the upper right, same family as the site's cursor glow. */
    body::before {
        content: '';
        position: absolute;
        width: 760px; height: 760px;
        right: -240px; top: -300px;
        background: radial-gradient(circle, rgba(181, 160, 238, .13) 0%, rgba(181, 160, 238, 0) 68%);
        pointer-events: none;
    }
    .stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        position: relative;
    }
    .mark { width: 132px; height: 132px; object-fit: contain; }
    .wordmark {
        margin-top: 34px;
        font-size: 92px;
        font-weight: 650;
        letter-spacing: -3.6px;
        white-space: nowrap;
    }
    .wordmark .vr { color: var(--accent); }
    .rule {
        margin-top: 44px;
        width: 620px;
        height: 1px;
        background: var(--line);
    }
    .tagline {
        margin-top: 30px;
        font-size: 30px;
        font-weight: 400;
        color: var(--muted);
        letter-spacing: -.3px;
    }
    .tagline b { color: var(--text); font-weight: 550; }
</style>
</head>
<body>
    <div class="stack">
        <img class="mark" src="../logo_no_bg.png" alt="">
        <div class="wordmark">EyeTrack<span class="vr">VR</span></div>
        <div class="rule" id="rule"></div>
        <div class="tagline" id="tagline">Make eye contact in social VR, <b>and more.</b></div>
    </div>
</body>
</html>
